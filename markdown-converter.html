<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML Converter - ToolNest</title>
  <meta name="description" content="Convert Markdown text to clean HTML code instantly for free.">
  <meta name="robots" content="index, follow">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RLN0M7YFJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4RLN0M7YFJ');
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
    nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
    header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; text-align: center; padding: 40px 20px; }
    header h1 { font-size: 2.2rem; margin-bottom: 10px; }
    header p { opacity: 0.9; max-width: 600px; margin: 0 auto; font-size: 1.1rem; }
    
    .container { max-width: 900px; margin: -30px auto 40px auto; padding: 0 20px; width: 100%; }
    .tool-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .pane label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
    textarea, pre { width: 100%; height: 300px; padding: 15px; font-size: 0.95rem; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; background: #fff; resize: vertical; }
    textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
    pre { background: #f1f5f9; overflow-x: auto; color: #0f172a; white-space: pre-wrap; word-wrap: break-word; }

    .copy-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .copy-btn:hover { background: #1d4ed8; }

    footer { background: #0f172a; color: white; text-align: center; padding: 20px; margin-top: auto; font-size: 0.9rem; }
    footer a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">ToolNest</a>
  </nav>

  <header>
    <h1>Markdown to HTML Converter</h1>
    <p>Convert markdown text into standard HTML format instantly.</p>
  </header>

  <div class="container">
    <div class="tool-card">
      <div class="grid-2">
        <div class="pane">
          <label for="markdownInput">Markdown Input:</label>
          <textarea id="markdownInput" placeholder="# Hello World&#10;&#10;Type your *markdown* here..." oninput="convertMarkdown()"></textarea>
        </div>
        <div class="pane">
          <label for="htmlOutput">Generated HTML:</label>
          <pre id="htmlOutput">&lt;h1&gt;Hello World&lt;/h1&gt;&#10;&lt;p&gt;Type your &lt;strong&gt;markdown&lt;/strong&gt; here...&lt;/p&gt;</pre>
          <button class="copy-btn" onclick="copyHTML()">Copy HTML</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ToolNest. All rights reserved. | <a href="index.html">Back to All Tools</a></p>
  </footer>

  <script>
    function convertMarkdown() {
      let md = document.getElementById('markdownInput').value;
      if (!md) {
        document.getElementById('htmlOutput').innerText = '';
        return;
      }

      let html = md
        // Headers
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Bold & Italic
        .replace(/\\(.?)\\*/gim, '<strong>$1</strong>')
        .replace(/\(.?)\*/gim, '<em>$1</em>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2">$1</a>')
        // Paragraphs (double line breaks)
        .split(/\n\s*\n/).map(para => {
          para = para.trim();
          if (!para.startsWith('<h') && para.length > 0) {
            return <p>${para.replace(/\n/g, '<br>')}</p>;
          }
          return para;
        }).join('\n');

      document.getElementById('htmlOutput').innerText = html;
    }

    function copyHTML() {
      const output = document.getElementById('htmlOutput').innerText;
      navigator.clipboard.writeText(output).then(() => {
        alert('HTML copied to clipboard!');
      });
    }

    // Initial load conversion
    convertMarkdown();
  </script>
</body>
</html>
