<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word & Character Counter - ToolNest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .counter-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2563eb;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #64748b;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus {
            border-color: #2563eb;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="index.html" style="color:white; text-decoration:none;">ToolNest</a></h1>
            <p>Word & Character Counter</p>
        </div>
    </header>

    <main class="container" style="background: white; padding: 2rem; border-radius: 12px; margin-bottom: 3rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <h2>Word & Character Counter</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Type or paste your text below to count words, characters, and sentences instantly.</p>

        <div class="counter-box">
            <div class="stat-card">
                <div class="num" id="wordsCount">0</div>
                <div class="label">Words</div>
            </div>
            <div class="stat-card">
                <div class="num" id="charsCount">0</div>
                <div class="label">Characters</div>
            </div>
            <div class="stat-card">
                <div class="num" id="sentencesCount">0</div>
                <div class="label">Sentences</div>
            </div>
            <div class="stat-card">
                <div class="num" id="paragraphsCount">0</div>
                <div class="label">Paragraphs</div>
            </div>
        </div>

        <textarea id="textInput" placeholder="Start typing or paste text here..."></textarea>

        <div class="btn-group">
            <button class="btn" style="background: #ef4444;" onclick="clearText()">Clear Text</button>
            <button class="btn" onclick="copyText()">Copy Text</button>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 ToolNest. Built for creators and developers.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            <a href="index.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Home</a> | 
            <a href="privacy-policy.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Privacy Policy</a> | 
            <a href="about.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">About Us</a> | 
            <a href="terms.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Terms of Service</a>
        </p>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');
        
        textInput.addEventListener('input', () => {
            const text = textInput.value;
            
            // Chars
            document.getElementById('charsCount').innerText = text.length;
            
            // Words
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('wordsCount').innerText = words;

            // Sentences
            const sentences = text.trim() ? text.split(/[.!?]+/).filter(Boolean).length : 0;
            document.getElementById('sentencesCount').innerText = sentences;

            // Paragraphs
            const paragraphs = text.trim() ? text.split(/\n+/).filter(Boolean).length : 0;
            document.getElementById('paragraphsCount').innerText = paragraphs;
        });

        function clearText() {
            textInput.value = '';
            textInput.dispatchEvent(new Event('input'));
        }

        function copyText() {
            if (textInput.value) {
                navigator.clipboard.writeText(textInput.value);
                alert('Text copied to clipboard!');
            }
        }
    </script>
</body>
</html>
