<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - ToolNest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
        }
        nav {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #1e293b;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            resize: vertical;
        }
        textarea:focus {
            border-color: #2563eb;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2563eb;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">← ToolNest</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>📝 Word & Character Counter</h1>
            <p class="subtitle">Type or paste your text below to get instant word count stats.</p>
            
            <textarea id="textInput" placeholder="Start typing or paste your text here..." oninput="countStats()"></textarea>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="wordCount">0</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="charCount">0</div>
                    <div class="stat-label">Characters</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="readingTime">0</div>
                    <div class="stat-label">Reading Time (Min)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function countStats() {
            let text = document.getElementById('textInput').value;
            
            // حساب الكلمات
            let words = text.trim().split(/\s+/).filter(word => word.length > 0);
            document.getElementById('wordCount').innerText = words.length;

            // حساب الحروف
            document.getElementById('charCount').innerText = text.length;

            // حساب وقت القراءة التقريبي (متوسط 200 كلمة فالدقيقة)
            let time = Math.ceil(words.length / 200);
            document.getElementById('readingTime').innerText = text.length > 0 ? time : 0;
        }
    </script>

</body>
</html>
