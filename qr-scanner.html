<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner from Image - ToolNest</title>
    <meta name="description" content="Scan and decode QR codes from images instantly in your browser. Free online tool.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center w-full">
            <a href="index.html" class="text-xl font-bold text-blue-600">ToolNest</a>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition">🏠 Home</a>
        </div>
    </header>

    <!-- Main Content Centered -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
            <h1 class="text-2xl font-bold mb-2 text-slate-800">Scan QR Code from Image</h1>
            <p class="text-slate-600 mb-6 text-center text-sm">Upload an image containing a QR code to read its content.</p>

            <!-- Upload Box -->
            <div class="w-full bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer mb-6" onclick="document.getElementById('qrUpload').click()">
                <input type="file" id="qrUpload" accept="image/*" class="hidden" onchange="handleQRUpload(event)">
                <p class="text-slate-600 font-medium text-sm">Click here to upload QR image</p>
                <span class="text-xs text-slate-400 mt-1 block">Supports PNG, JPG, WEBP</span>
            </div>

            <!-- Preview & Result -->
            <div id="resultSection" class="w-full hidden flex flex-col items-center gap-4">
                <div class="max-w-xs w-full bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <img id="imagePreview" class="w-full h-auto rounded object-contain max-h-40 mx-auto" alt="QR Preview">
                </div>

                <div class="w-full bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <label class="font-semibold text-xs text-slate-700 block mb-2">Scan Result:</label>
                    <div class="flex gap-2">
                        <input type="text" id="qrResultText" readonly class="w-full p-2 border border-slate-300 rounded bg-white font-mono text-xs focus:outline-none">
                        <button onclick="copyResult()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-xs transition">Copy</button>
                    </div>
                    <div id="linkContainer" class="mt-2 hidden">
                        <a id="openLinkBtn" href="#" target="_blank" class="text-blue-600 hover:underline text-xs font-medium">Open Link ↗</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function handleQRUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    document.getElementById('imagePreview').src = img.src;
                    document.getElementById('resultSection').classList.remove('hidden');
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imgData.data, imgData.width, imgData.height);
                    const resultInput = document.getElementById('qrResultText');
                    const linkContainer = document.getElementById('linkContainer');
                    const openLinkBtn = document.getElementById('openLinkBtn');

                    if (code) {
                        resultInput.value = code.data;
                        if (code.data.startsWith('http://') || code.data.startsWith('https://')) {
                            openLinkBtn.href = code.data;
                            linkContainer.classList.remove('hidden');
                        } else {
                            linkContainer.classList.add('hidden');
                        }
                    } else {
                        resultInput.value = "No QR code found in this image.";
                        linkContainer.classList.add('hidden');
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function copyResult() {
            const text = document.getElementById('qrResultText').value;
            navigator.clipboard.writeText(text);
            alert('Result copied to clipboard!');
        }
    </script>
</body>
</html>
