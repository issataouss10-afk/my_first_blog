<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator - ToolNest Free Developer Tools</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Free online JSON formatter and validator tool. Format, validate, and beautify your messy JSON data instantly and securely on ToolNest.">
    <meta name="keywords" content="json formatter, json validator, beautify json, json parser, developer tools, toolnest">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-layout { display: flex; gap: 20px; align-items: flex-start; }
        /* مساحة فارغة نظيفة للإعلانات في الجانب */
        .ad-sidebar { width: 200px; min-height: 400px; }
        .tool-main-content { flex: 1; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        /* مساحة فارغة نظيفة للإعلانات في الفوق والتحت */
        .ad-banner { width: 100%; min-height: 90px; margin-bottom: 20px; }
        
        .json-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        @media(max-width: 768px) { .json-grid { grid-template-columns: 1fr; } }
        
        textarea { width: 100%; height: 250px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: monospace; font-size: 0.95rem; resize: vertical; box-sizing: border-box; outline: none; }
        textarea:focus { border-color: #2563eb; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        @media(max-width: 900px) { .ad-sidebar { display: none; } }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="index.html" style="color:white; text-decoration:none;">ToolNest</a></h1>
            <p>JSON Formatter & Validator</p>
        </div>
    </header>

    <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
        <!-- مكان فارغ نظيف لإعلان الفوق -->
        <div class="ad-banner"></div>

        <div class="page-layout">
            <!-- مكان فارغ نظيف لإعلان الجانب الأيسر -->
            <div class="ad-sidebar"></div>

            <!-- محتوى الأداة الأساسي -->
            <div class="tool-main-content">
                <h2>JSON Formatter & Validator</h2>
                <p style="color: #64748b; margin-bottom: 1.5rem;">Format, validate, and beautify your messy JSON data instantly.</p>
                
                <div class="json-grid">
                    <div>
                        <label style="display:block; font-weight:bold; margin-bottom: 5px;">Paste your raw JSON here:</label>
                        <textarea id="jsonInput" placeholder='{"name": "ToolNest", "active": true}'></textarea>
                    </div>
                    <div>
                        <label style="display:block; font-weight:bold; margin-bottom: 5px;">Formatted Result:</label>
                        <textarea id="jsonOutput" readonly placeholder="Formatted JSON will appear here..."></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn" onclick="formatJSON()">Format / Prettify</button>
                    <button class="btn" style="background: #dc2626;" onclick="clearJSON()">Clear</button>
                    <button class="btn" style="background: #475569;" onclick="copyJSON()">Copy Result</button>
                </div>
            </div>

            <!-- مكان فارغ نظيف لإعلان الجانب الأيمن -->
            <div class="ad-sidebar"></div>
        </div>

        <!-- مكان فارغ نظيف لإعلان التحت -->
        <div class="ad-banner" style="margin-top: 20px;"></div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 ToolNest. Built for creators and developers.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            <a href="index.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Home</a> | 
            <a href="privacy-policy.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Privacy Policy</a> | 
            <a href="about.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">About Us</a> | 
            <a href="terms.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Terms of Service</a>
        </p>
    </footer>

    <script>
        function formatJSON() {
            try {
                const input = document.getElementById('jsonInput').value;
                if(!input.trim()) {
                    alert('Please enter some JSON data first.');
                    return;
                }
                const parsed = JSON.parse(input);
                document.getElementById('jsonOutput').value = JSON.stringify(parsed, null, 4);
            } catch(error) {
                alert('Invalid JSON format: ' + error.message);
            }
        }

        function clearJSON() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').value = '';
        }

        function copyJSON() {
            const out = document.getElementById('jsonOutput');
            if(out.value) {
                navigator.clipboard.writeText(out.value);
                alert('Formatted JSON copied to clipboard!');
            }
        }
    </script>
</body>
</html>
