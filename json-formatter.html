<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator - ToolNest</title>
    <meta name="description" content="Format, validate and prettify your JSON data instantly.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <i class="fa-solid fa-toolbox"></i> ToolNest
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition flex items-center gap-1 bg-slate-100 px-4 py-2 rounded-lg border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> Home
            </a>
        </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full">
        
        <!-- Title -->
        <div class="text-center mb-10">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-sm">
                <i class="fa-solid fa-code"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-2">JSON Formatter & Validator</h1>
            <p class="text-slate-600 text-base max-w-lg mx-auto">Format, validate, and beautify your messy JSON data instantly.</p>
        </div>

        <!-- Tool Box -->
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Input Area -->
                <div class="flex flex-col">
                    <label for="json-input" class="block text-sm font-semibold text-slate-700 mb-2">Paste your raw JSON here:</label>
                    <textarea id="json-input" rows="10" placeholder='{"name": "ToolNest", "active": true}' class="w-full bg-slate-50 text-slate-800 p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-mono text-sm"></textarea>
                </div>

                <!-- Output Area -->
                <div class="flex flex-col">
                    <label for="json-output" class="block text-sm font-semibold text-slate-700 mb-2">Formatted Result:</label>
                    <textarea id="json-output" rows="10" readonly placeholder="Formatted JSON will appear here..." class="w-full bg-slate-100 text-slate-800 p-4 rounded-xl border border-slate-300 outline-none font-mono text-sm"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 pt-4 border-t border-slate-100">
                <button onclick="formatJSON()" class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-xl hover:bg-blue-700 transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Format / Prettify
                </button>
                <button onclick="clearJSON()" class="bg-slate-200 text-slate-700 font-semibold px-6 py-3 rounded-xl hover:bg-slate-300 transition flex items-center gap-2">
                    <i class="fa-solid fa-trash"></i> Clear
                </button>
            </div>

            <!-- Status message -->
            <div id="status-msg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500 mt-12">
        <p>© 2026 ToolNest. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        function formatJSON() {
            const input = document.getElementById('json-input').value.trim();
            const output = document.getElementById('json-output');
            const status = document.getElementById('status-msg');

            if (!input) {
                status.className = "p-4 rounded-xl text-sm font-medium bg-amber-50 text-amber-700 border border-amber-200";
                status.textContent = "Please enter some JSON data first.";
                status.classList.remove('hidden');
                return;
            }

            try {
                const parsed = JSON.parse(input);
                output.value = JSON.stringify(parsed, null, 4);
                status.className = "p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
                status.textContent = "Valid JSON! Formatted successfully.";
                status.classList.remove('hidden');
            } catch (error) {
                output.value = "";
                status.className = "p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200";
                status.textContent = "Invalid JSON Error: " + error.message;
                status.classList.remove('hidden');
            }
        }

        function clearJSON() {
            document.getElementById('json-input').value = "";
            document.getElementById('json-output').value = "";
            document.getElementById('status-msg').classList.add('hidden');
        }
    </script>
</body>
</html>
