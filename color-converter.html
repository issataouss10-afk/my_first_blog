<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Converter | ToolNest</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    main {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .panel {
      margin-bottom: 20px;
    }

    .panel-header {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 15px;
      color: var(--text);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    #colorPreview {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      background-color: #2563eb;
      transition: background-color 0.2s;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    #statusBar {
      font-size: 13px;
      min-height: 20px;
      margin-bottom: 20px;
      color: var(--text-secondary);
    }

    .copy-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: var(--border);
    }
  </style>
</head>
<body>

  <header>
    <h1>Color Converter</h1>
    <p>Convert colors between HEX, RGB, HSL, and CMYK instantly.</p>
  </header>

  <main>
    <!-- Color Preview -->
    <div id="colorPreview"></div>

    <!-- Conversion Settings -->
    <div class="panel">
      <div class="panel-header">Conversion Settings</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;">
        <div>
          <label>From</label>
          <select id="fromFormat">
            <option value="hex">HEX</option>
            <option value="rgb">RGB</option>
          </select>
        </div>
        <div>
          <label>To</label>
          <select id="toFormat">
            <option value="rgb">RGB</option>
            <option value="hex">HEX</option>
            <option value="hsl">HSL</option>
            <option value="cmyk">CMYK</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Color Input & Picker -->
    <div class="panel">
      <div class="panel-header">Color Input</div>
      <input
        id="colorInput"
        type="text"
        placeholder="#2563EB أو rgb(37,99,235)"
      >
      <div style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <input
          type="color"
          id="colorPicker"
          value="#2563EB"
          style="width:60px;height:42px;border:none;cursor:pointer;background:none;border-radius:6px;"
        >
        <span style="color:var(--text-secondary);font-size:13px;">
          Pick a color visually or type a value above.
        </span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button id="convertBtn" class="btn btn-primary">Convert</button>
      <button id="swapBtn" class="btn btn-secondary">🔄 Swap</button>
    </div>

    <div id="statusBar"></div>

    <!-- Results Grid -->
    <div class="panel" style="margin-bottom: 0;">
      <div class="panel-header">Output Values</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;">
        <div>
          <label>HEX</label>
          <div style="display:flex;gap:6px;">
            <input id="hexValue" readonly>
            <button class="copy-btn" data-copy="hexValue" title="Copy HEX">📋</button>
          </div>
        </div>
        <div>
          <label>RGB</label>
          <div style="display:flex;gap:6px;">
            <input id="rgbValue" readonly>
            <button class="copy-btn" data-copy="rgbValue" title="Copy RGB">📋</button>
          </div>
        </div>
        <div>
          <label>HSL</label>
          <div style="display:flex;gap:6px;">
            <input id="hslValue" readonly>
            <button class="copy-btn" data-copy="hslValue" title="Copy HSL">📋</button>
          </div>
        </div>
        <div>
          <label>CMYK</label>
          <div style="display:flex;gap:6px;">
            <input id="cmykValue" readonly>
            <button class="copy-btn" data-copy="cmykValue" title="Copy CMYK">📋</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const COLOR_STORAGE_KEY = "toolnest_color_converter";
    const statusBar = document.getElementById("statusBar");
    const colorPicker = document.getElementById("colorPicker");

    function showStatus(message, color = "var(--text-secondary)") {
      statusBar.textContent = message;
      statusBar.style.color = color;
    }

    // HEX -> RGB
    function hexToRgb(hex) {
      hex = hex.replace("#", "");
      if (hex.length === 3) {
        hex = hex.split("").map(c => c + c).join("");
      }
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    // RGB -> HEX
    function rgbToHex(r, g, b) {
      return "#" + [r, g, b]
        .map(v => Number(v).toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    // RGB -> HSL
    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let h, s;
      const l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          default: h = (r - g) / d + 4;
        }
        h /= 6;
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    // RGB -> CMYK
    function rgbToCmyk(r, g, b) {
      let c = 1 - (r / 255);
      let m = 1 - (g / 255);
      let y = 1 - (b / 255);
      const k = Math.min(c, m, y);
      if (k === 1) {
        return { c: 0, m: 0, y: 0, k: 100 };
      }
      c = ((c - k) / (1 - k)) * 100;
      m = ((m - k) / (1 - k)) * 100;
      y = ((y - k) / (1 - k)) * 100;
      return {
        c: Math.round(c),
        m: Math.round(m),
        y: Math.round(y),
        k: Math.round(k * 100)
      };
    }

    function updatePreview(hex) {
      document.getElementById("colorPreview").style.background = hex;
    }

    // Convert Button Action
    document.getElementById("convertBtn").addEventListener("click", () => {
      const input = document.getElementById("colorInput").value.trim();
      const from = document.getElementById("fromFormat").value;

      if (!input) {
        showStatus("Please enter a color value.", "#ef4444");
        return;
      }

      try {
        let hex = "";
        if (from === "hex") {
          hex = input.startsWith("#") ? input : "#" + input;
          if (!/^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(hex)) throw new Error();
        } else if (from === "rgb") {
          const rgbMatch = input.match(/\d+/g);
          if (!rgbMatch || rgbMatch.length !== 3) throw new Error();
          hex = rgbToHex(Number(rgbMatch[0]), Number(rgbMatch[1]), Number(rgbMatch[2]));
        }

        const rgb = hexToRgb(hex);
        const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
        const cmyk = rgbToCmyk(rgb.r, rgb.g, rgb.b);

        colorPicker.value = hex;
        updatePreview(hex);

        document.getElementById("hexValue").value = hex.toUpperCase();
        document.getElementById("rgbValue").value = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
        document.getElementById("hslValue").value = `${hsl.h}°, ${hsl.s}%, ${hsl.l}%`;
        document.getElementById("cmykValue").value = `${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%`;

        localStorage.setItem(COLOR_STORAGE_KEY, input);
        showStatus("Color converted successfully!", "var(--success)");
      } catch {
        showStatus("Invalid color value format.", "#ef4444");
      }
    });

    // Color Picker Event
    colorPicker.addEventListener("input", () => {
      document.getElementById("colorInput").value = colorPicker.value;
      document.getElementById("fromFormat").value = "hex";
      document.getElementById("convertBtn").click();
    });

    // Auto Convert on typing
    document.getElementById("colorInput").addEventListener("input", () => {
      if (document.getElementById("colorInput").value.trim() !== "") {
        document.getElementById("convertBtn").click();
      }
    });

    // Swap Formats
    document.getElementById("swapBtn").addEventListener("click", () => {
      const from = document.getElementById("fromFormat");
      const to = document.getElementById("toFormat");
      const temp = from.value;
      from.value = to.value;
      to.value = temp;
      if (document.getElementById("colorInput").value.trim() !== "") {
        document.getElementById("convertBtn").click();
      }
    });

    // Copy functionality
    document.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const value = document.getElementById(btn.dataset.copy).value;
        if (!value) return;
        navigator.clipboard.writeText(value);
        btn.textContent = "✅";
        setTimeout(() => { btn.textContent = "📋"; }, 1200);
      });
    });

    // Restore on Load
    window.addEventListener("DOMContentLoaded", () => {
      const savedColor = localStorage.getItem(COLOR_STORAGE_KEY);
      if (savedColor) {
        document.getElementById("colorInput").value = savedColor;
        document.getElementById("convertBtn").click();
        showStatus("Previous color restored.", "var(--primary)");
      }
    });

    // Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key === "Enter") {
        e.preventDefault();
        document.getElementById("convertBtn").click();
      }
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        navigator.clipboard.writeText(document.getElementById("hexValue").value);
        showStatus("HEX copied!", "var(--success)");
      }
      if (e.key === "Escape") {
        document.getElementById("colorInput").value = "";
        document.getElementById("hexValue").value = "";
        document.getElementById("rgbValue").value = "";
        document.getElementById("hslValue").value = "";
        document.getElementById("cmykValue").value = "";
        showStatus("Cleared!", "var(--text-secondary)");
      }
    });
  </script>
</body>
</html>
