<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolNest - Free Online Utilities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
        }

        nav {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
        }

        header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .tool-card h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .tool-card p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .btn-open {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
        }

        .btn-open:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ToolNest</a>
    </nav>

    <header>
        <h1>Free Online Web Utilities</h1>
        <p>Select any tool below to use it instantly.</p>
    </header>

    <div class="container">
        <div class="tools-grid">
            
            <!-- الأداة 1: QR Code -->
            <div class="tool-card">
                <h2>📱 QR Code Generator</h2>
                <p>Generate downloadable custom QR codes instantly.</p>
                <a href="qr-generator.html" class="btn-open">Open Tool →</a>
            </div>

            <!-- الأداة 2: Image Compressor -->
            <div class="tool-card">
                <h2>📷 Image Compressor</h2>
                <p>Reduce image file size instantly without quality loss.</p>
                <a href="image-compressor.html" class="btn-open">Open Tool →</a>
            </div>

        </div>
    </div>

    <footer>
        <p>© 2026 ToolNest • Professional Web Utilities</p>
    </footer>

</body>
</html>
