<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolNest - Free Online Developer Utilities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <i class="fa-solid fa-toolbox"></i> ToolNest
            </h1>
            <p class="text-sm text-slate-500 hidden sm:block">Free, Fast & Simple Online Utilities</p>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="max-w-6xl mx-auto px-4 py-16 flex-grow">
        <div class="text-center mb-12">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-3">Welcome to ToolNest</h2>
            <p class="text-slate-600 text-lg max-w-2xl mx-auto">Your ultimate collection of free daily developer and web tools to make your work easier.</p>
        </div>

        <!-- Tools Grid (Empty and ready for our first professional tool) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tools-container">
            <!-- First tool will be added here soon -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>© 2026 ToolNest. All rights reserved.</p>
    </footer>

</body>
</html>
