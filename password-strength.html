<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker - ToolNest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        .strength-meter { height: 10px; background: #e2e8f0; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; transition: width 0.3s, background 0.3s; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="index.html" style="color:white; text-decoration:none;">ToolNest</a></h1>
            <p>Password Strength Checker</p>
        </div>
    </header>
    <main class="container" style="background: white; padding: 2rem; border-radius: 12px; margin-bottom: 3rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <h2>Password Strength Checker</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Test how secure your password is against modern security threats.</p>
        <input type="text" id="pwdInput" placeholder="Enter password to check..." oninput="checkStrength()">
        <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
        <p id="strengthText" style="font-weight: bold; color: #475569;">Strength: Enter a password</p>
    </main>
    <footer class="main-footer">
        <p>&copy; 2026 ToolNest. Built for creators and developers.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            <a href="index.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Home</a> | 
            <a href="privacy-policy.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Privacy Policy</a> | 
            <a href="about.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">About Us</a> | 
            <a href="terms.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Terms of Service</a>
        </p>
    </footer>
    <script>
        function checkStrength() {
            const val = document.getElementById('pwdInput').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            if (val.length === 0) { bar.style.width = '0%'; text.innerText = 'Strength: Enter a password'; }
            else if (score <= 1) { bar.style.width = '25%'; bar.style.background = '#ef4444'; text.innerText = 'Strength: Weak'; }
            else if (score === 2 || score === 3) { bar.style.width = '65%'; bar.style.background = '#f59e0b'; text.innerText = 'Strength: Medium'; }
            else { bar.style.width = '100%'; bar.style.background = '#10b981'; text.innerText = 'Strength: Strong'; }
        }
    </script>
</body>
</html>
