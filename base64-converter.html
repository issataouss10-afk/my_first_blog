<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder / Decoder - ToolNest Free Developer Tools</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Free online Base64 encoder and decoder tool. Easily encode plain text to Base64 format or decode Base64 back to readable text securely on ToolNest.">
    <meta name="keywords" content="base64 encoder, base64 decoder, encode base64 online, decode base64, developer tools, toolnest">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-layout { display: flex; gap: 20px; align-items: flex-start; }
        /* مساحة فارغة نظيفة للإعلانات في الجانب */
        .ad-sidebar { width: 200px; min-height: 400px; }
        .tool-main-content { flex: 1; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        /* مساحة فارغة نظيفة للإعلانات في الفوق والتحت */
        .ad-banner { width: 100%; min-height: 90px; margin-bottom: 20px; }
        
        textarea { width: 100%; height: 140px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; resize: vertical; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        textarea:focus { border-color: #2563eb; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        @media(max-width: 900px) { .ad-sidebar { display: none; } }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="index.html" style="color:white; text-decoration:none;">ToolNest</a></h1>
            <p>Base64 Encoder & Decoder</p>
        </div>
    </header>

    <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
        <!-- مكان فارغ نظيف لإعلان الفوق -->
        <div class="ad-banner"></div>

        <div class="page-layout">
            <!-- مكان فارغ نظيف لإعلان الجانب الأيسر -->
            <div class="ad-sidebar"></div>

            <!-- محتوى الأداة الأساسي -->
            <div class="tool-main-content">
                <h2>Base64 Encoder / Decoder</h2>
                <p style="color: #64748b; margin-bottom: 1.5rem;">Encode plain text to Base64 format or decode Base64 back to readable text.</p>
                
                <label style="display:block; font-weight:bold; margin-bottom: 5px;">Input Text / Base64:</label>
                <textarea id="inputText" placeholder="Type or paste content here..."></textarea>
                
                <div class="btn-group">
                    <button class="btn" onclick="encodeBase64()">Encode to Base64</button>
                    <button class="btn" style="background: #059669;" onclick="decodeBase64()">Decode from Base64</button>
                </div>
                
                <label style="display:block; font-weight:bold; margin-bottom: 5px;">Output Result:</label>
                <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
                
                <button class="btn" style="background: #475569;" onclick="copyOutput()">Copy Result</button>
            </div>

            <!-- مكان فارغ نظيف لإعلان الجانب الأيمن -->
            <div class="ad-sidebar"></div>
        </div>

        <!-- مكان فارغ نظيف لإعلان التحت -->
        <div class="ad-banner" style="margin-top: 20px;"></div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 ToolNest. Built for creators and developers.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            <a href="index.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Home</a> | 
            <a href="privacy-policy.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Privacy Policy</a> | 
            <a href="about.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">About Us</a> | 
            <a href="terms.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Terms of Service</a>
        </p>
    </footer>

    <script>
        function encodeBase64() {
            try {
                const text = document.getElementById('inputText').value;
                document.getElementById('outputText').value = btoa(unescape(encodeURIComponent(text)));
            } catch(e) { alert('Encoding error!'); }
        }
        function decodeBase64() {
            try {
                const text = document.getElementById('inputText').value;
                document.getElementById('outputText').value = decodeURIComponent(escape(atob(text)));
            } catch(e) { alert('Invalid Base64 string!'); }
        }
        function copyOutput() { 
            const out = document.getElementById('outputText');
            if(out.value) {
                navigator.clipboard.writeText(out.value); 
                alert('Result copied to clipboard!'); 
            }
        }
    </script>
</body>
</html>
