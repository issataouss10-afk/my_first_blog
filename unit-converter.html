<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter - Length, Weight, Temperature - ToolNest</title>
  <meta name="description" content="Free online unit converter. Easily convert length, weight, and temperature units instantly.">
  <meta name="robots" content="index, follow">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RLN0M7YFJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
    nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
    header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; text-align: center; padding: 40px 20px; }
    header h1 { font-size: 2.2rem; margin-bottom: 10px; }
    header p { opacity: 0.9; max-width: 600px; margin: 0 auto; font-size: 1.1rem; }
    
    .container { max-width: 650px; margin: -30px auto 40px auto; padding: 0 20px; width: 100%; }
    .tool-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
    select, input[type="number"] { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; background: #fff; transition: 0.3s; }
    select:focus, input[type="number"]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .result-box { margin-top: 25px; background: #f1f5f9; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; }
    .result-box h3 { color: #64748b; margin-bottom: 8px; font-size: 1rem; }
    .result-value { font-size: 1.8rem; font-weight: 800; color: #2563eb; }

    footer { background: #0f172a; color: white; text-align: center; padding: 20px; margin-top: auto; font-size: 0.9rem; }
    footer a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">ToolNest</a>
  </nav>

  <header>
    <h1>Unit Converter</h1>
    <p>Convert length, weight, and temperature instantly.</p>
  </header>

  <div class="container">
    <div class="tool-card">
      <div class="input-group">
        <label for="category">Select Category:</label>
        <select id="category" onchange="updateUnits()">
          <option value="length">Length</option>
          <option value="weight">Weight</option>
          <option value="temp">Temperature</option>
        </select>
      </div>

      <div class="input-group">
        <label for="inputValue">Enter Value:</label>
        <input type="number" id="inputValue" value="1" oninput="convert()">
      </div>

      <div class="grid-2">
        <div class="input-group">
          <label for="fromUnit">From:</label>
          <select id="fromUnit" onchange="convert()"></select>
        </div>
        <div class="input-group">
          <label for="toUnit">To:</label>
          <select id="toUnit" onchange="convert()"></select>
        </div>
      </div>

      <div class="result-box">
        <h3>Converted Result:</h3>
        <div id="result" class="result-value">1 m = 3.28 ft</div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ToolNest. All rights reserved. | <a href="index.html">Back to All Tools</a></p>
  </footer>

  <script>
    const unitsData = {
      length: {
        'Meter (m)': 1,
        'Kilometer (km)': 1000,
        'Centimeter (cm)': 0.01,
        'Foot (ft)': 0.3048,
        'Inch (in)': 0.0254,
        'Mile (mi)': 1609.34
      },
      weight: {
        'Kilogram (kg)': 1,
        'Gram (g)': 0.001,
        'Pound (lb)': 0.453592,
        'Ounce (oz)': 0.0283495
      },
      temp: {
        'Celsius (°C)': 'C',
        'Fahrenheit (°F)': 'F',
        'Kelvin (K)': 'K'
      }
    };

    function updateUnits() {
      const cat = document.getElementById('category').value;
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const keys = Object.keys(unitsData[cat]);
      keys.forEach((unit, idx) => {
        fromSelect.add(new Option(unit, unit));
        toSelect.add(new Option(unit, unit));
      });

      if (keys.length > 1) toSelect.selectedIndex = 1;
      convert();
    }

    function convert() {
      const cat = document.getElementById('category').value;
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const resultDiv = document.getElementById('result');

      if (isNaN(val)) {
        resultDiv.innerText = "Please enter a valid number";
        return;
      }

      if (cat === 'temp') {
        let res = convertTemp(val, unitsData.temp[from], unitsData.temp[to]);
        resultDiv.innerText = `${val} ${from} = ${res.toFixed(2)} ${to}`;
      } else {
        let inBase = val * unitsData[cat][from];
        let res = inBase / unitsData[cat][to];
        resultDiv.innerText = `${val} ${from} = ${res.toFixed(4)} ${to}`;
      }
    }

    function convertTemp(val, from, to) {
      if (from === to) return val;
      let celsius;
      if (from === 'C') celsius = val;
      else if (from === 'F') celsius = (val - 32) * 5/9;
      else if (from === 'K') celsius = val - 273.15;

      if (to === 'C') return celsius;
      if (to === 'F') return (celsius * 9/5) + 32;
      if (to === 'K') return celsius + 273.15;
    }

    updateUnits();
  </script>
</body>
</html>
