<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Visualizer - ToolNest</title>
    <meta name="description" content="Analyze password strength, entropy, and cracking time securely in your browser.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-blue-600">ToolNest</a>
            <span class="text-sm text-slate-500">Password Visualizer</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-xl mx-auto w-full p-6 flex flex-col justify-center">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold mb-4 text-slate-800 text-center">Password Strength Visualizer</h1>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2 text-slate-700">Type or paste password:</label>
                <input type="text" id="pwdInput" oninput="analyzePassword()" placeholder="Enter password..." class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm">
            </div>

            <!-- Strength Bar -->
            <div class="w-full bg-slate-200 h-3 rounded-full mb-4 overflow-hidden">
                <div id="strengthBar" class="h-full w-0 transition-all duration-300"></div>
            </div>

            <div class="space-y-2 text-sm">
                <p><strong>Strength:</strong> <span id="strengthText" class="font-semibold text-slate-500">Empty</span></p>
                <p><strong>Estimated Crack Time:</strong> <span id="crackTime" class="font-mono text-slate-700">-</span></p>
            </div>

            <div class="mt-6 border-t pt-4">
                <h3 class="font-semibold text-sm mb-2 text-slate-700">Checklist:</h3>
                <ul id="checklist" class="space-y-1 text-xs text-slate-600">
                    <li id="lengthCheck">❌ At least 8 characters</li>
                    <li id="upperCheck">❌ Contains uppercase letter</li>
                    <li id="numberCheck">❌ Contains number</li>
                    <li id="symbolCheck">❌ Contains special symbol</li>
                </ul>
            </div>
        </div>
    </main>

    <script>
        function analyzePassword() {
            const pwd = document.getElementById('pwdInput').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            const crackTime = document.getElementById('crackTime');

            let score = 0;
            const hasLength = pwd.length >= 8;
            const hasUpper = /[A-Z]/.test(pwd);
            const hasNumber = /[0-9]/.test(pwd);
            const hasSymbol = /[^A-Za-z0-9]/.test(pwd);

            updateCheck('lengthCheck', hasLength, 'At least 8 characters');
            updateCheck('upperCheck', hasUpper, 'Contains uppercase letter');
            updateCheck('numberCheck', hasNumber, 'Contains number');
            updateCheck('symbolCheck', hasSymbol, 'Contains special symbol');

            if (hasLength) score++;
            if (hasUpper) score++;
            if (hasNumber) score++;
            if (hasSymbol) score++;
            if (pwd.length >= 12) score++;

            let width = '0%';
            let color = 'bg-slate-200';
            let strength = 'Empty';
            let time = '-';

            if (pwd.length > 0) {
                if (score <= 2) {
                    width = '25%'; color = 'bg-red-500'; strength = 'Weak'; time = 'Instant';
                } else if (score === 3 || score === 4) {
                    width = '65%'; color = 'bg-amber-500'; strength = 'Moderate'; time = 'A few hours / days';
                } else {
                    width = '100%'; color = 'bg-emerald-500'; strength = 'Strong'; time = 'Centuries';
                }
            }

            bar.style.width = width;
            bar.className = `h-full transition-all duration-300 ${color}`;
            text.innerText = strength;
            crackTime.innerText = time;
        }

        function updateCheck(elementId, isValid, text) {
            const el = document.getElementById(elementId);
            el.innerText = (isValid ? '✅ ' : '❌ ') + text;
            el.className = isValid ? 'text-emerald-600 font-medium' : 'text-slate-400';
        }
    </script>
</body>
</html>
