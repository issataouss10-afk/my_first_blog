<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Case Converter - ToolNest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
        }
        nav {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #1e293b;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            resize: vertical;
            margin-bottom: 20px;
        }
        textarea:focus {
            border-color: #2563eb;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.btn-clear {
            background: #ef4444;
        }
        button.btn-clear:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">← ToolNest</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>🔤 Text Case Converter</h1>
            <p class="subtitle">Type or paste your text below and convert it to any case instantly.</p>
            
            <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

            <div class="btn-group">
                <button onclick="toUpper()">UPPERCASE</button>
                <button onclick="toLower()">lowercase</button>
                <button onclick="toTitle()">Title Case</button>
                <button onclick="toSentence()">Sentence case</button>
                <button onclick="copyText()">📋 Copy Text</button>
                <button onclick="clearText()" class="btn-clear">Clear</button>
            </div>
        </div>
    </div>

    <script>
        function toUpper() {
            let textarea = document.getElementById('textInput');
            textarea.value = textarea.value.toUpperCase();
        }

        function toLower() {
            let textarea = document.getElementById('textInput');
            textarea.value = textarea.value.toLowerCase();
        }

        function toTitle() {
            let textarea = document.getElementById('textInput');
            textarea.value = textarea.value.toLowerCase().replace(/(?:^|\s)\w/g, function(match) {
                return match.toUpperCase();
            });
        }

        function toSentence() {
            let textarea = document.getElementById('textInput');
            let text = textarea.value.toLowerCase();
            textarea.value = text.replace(/(^\s*|[.!?]\s*)([a-z])/g, function(m, p1, p2) {
                return p1 + p2.toUpperCase();
            });
        }

        function copyText() {
            let textarea = document.getElementById('textInput');
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert("Text copied to clipboard!");
        }

        function clearText() {
            document.getElementById('textInput').value = "";
        }
    </script>

</body>
</html>
