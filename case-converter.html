<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Case Converter - ToolNest Free Text Tools</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Free online text case converter tool. Convert your text to Uppercase, Lowercase, Title Case, and more instantly on ToolNest.">
    <meta name="keywords" content="case converter, uppercase, lowercase, title case, text tools, toolnest">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-layout { display: flex; gap: 20px; align-items: flex-start; }
        /* مساحة فارغة نظيفة للإعلانات في الجانب */
        .ad-sidebar { width: 200px; min-height: 400px; }
        .tool-main-content { flex: 1; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        /* مساحة فارغة نظيفة للإعلانات في الفوق والتحت */
        .ad-banner { width: 100%; min-height: 90px; margin-bottom: 20px; }
        
        textarea { width: 100%; height: 160px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; resize: vertical; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        textarea:focus { border-color: #2563eb; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        @media(max-width: 900px) { .ad-sidebar { display: none; } }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="index.html" style="color:white; text-decoration:none;">ToolNest</a></h1>
            <p>Case Converter</p>
        </div>
    </header>

    <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
        <!-- مكان فارغ نظيف لإعلان الفوق -->
        <div class="ad-banner"></div>

        <div class="page-layout">
            <!-- مكان فارغ نظيف لإعلان الجانب الأيسر -->
            <div class="ad-sidebar"></div>

            <!-- محتوى الأداة الأساسي -->
            <div class="tool-main-content">
                <h2>Text Case Converter</h2>
                <p style="color: #64748b; margin-bottom: 1.5rem;">Convert your text to Uppercase, Lowercase, Title Case, and more.</p>
                
                <textarea id="textInput" placeholder="Type or paste text here..."></textarea>
                
                <div class="btn-group">
                    <button class="btn" style="background: #2563eb;" onclick="convertToUppercase()">UPPERCASE</button>
                    <button class="btn" style="background: #059669;" onclick="convertToLowercase()">lowercase</button>
                    <button class="btn" style="background: #d97706;" onclick="convertToTitleCase()">Title Case</button>
                </div>
                
                <button class="btn" style="background: #475569;" onclick="copyText()">Copy Result</button>
            </div>

            <!-- مكان فارغ نظيف لإعلان الجانب الأيمن -->
            <div class="ad-sidebar"></div>
        </div>

        <!-- مكان فارغ نظيف لإعلان التحت -->
        <div class="ad-banner" style="margin-top: 20px;"></div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 ToolNest. Built for creators and developers.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            <a href="index.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Home</a> | 
            <a href="privacy-policy.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Privacy Policy</a> | 
            <a href="about.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">About Us</a> | 
            <a href="terms.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Terms of Service</a>
        </p>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');

        function convertToUppercase() {
            textInput.value = textInput.value.toUpperCase();
        }

        function convertToLowercase() {
            textInput.value = textInput.value.toLowerCase();
        }

        function convertToTitleCase() {
            textInput.value = textInput.value.toLowerCase().split(' ').map(word => {
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function copyText() {
            if(textInput.value) {
                navigator.clipboard.writeText(textInput.value);
                alert('Text copied to clipboard!');
            }
        }
    </script>
</body>
</html>
