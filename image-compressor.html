<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - ToolNest</title>
    <meta name="description" content="Compress your images quickly and for free without losing quality.">
    
    <!-- ربط ملف الـ CSS المشترك والفخم -->
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة ضغط الصور -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
</head>
<body data-theme="dark">

<nav>
    <a href="index.html" class="logo">ToolNest ⚡</a>
    <div class="nav-actions">
      <button class="fav-nav-btn" id="favBtn" onclick="toggleCurrentFavorite()">☆ Favorite</button>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
    </div>
</nav>

<header style="background: var(--header-bg); color: white; text-align: center; padding: 50px 20px; border-bottom: 1px solid var(--border-color);">
    <h1 style="font-size: 2.2rem; margin-bottom: 10px; font-weight: 800; color: #ffffff;">📷 Image Compressor</h1>
    <p style="opacity: 0.9; max-width: 600px; margin: 0 auto; font-size: 1.1rem; color: #94a3b8;">Select an image to reduce its file size instantly.</p>
</header>

<div class="container" style="max-width: 800px; margin: -30px auto 40px auto; padding: 0 20px; width: 100%; position: relative; z-index: 10;">
    <div class="tool-card">
        <div style="margin-bottom: 20px;">
            <input type="file" id="upload-image" accept="image/*" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; background: rgba(255, 255, 255, 0.03); color: var(--text-color); cursor: pointer;" />
        </div>
        
        <div>
            <button onclick="compressImage()">Compress Image</button>
        </div>

        <div id="result" style="margin-top: 25px; display: none; text-align: center;">
            <p id="size-info" style="color: var(--primary); font-weight: 600; margin-bottom: 15px;"></p>
            <a id="download-btn" style="display: inline-block; padding: 10px 20px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 600;" download="compressed.jpg">Download Image</a>
        </div>
    </div>
</div>

<footer>&copy; 2026 ToolNest • Free Online Utilities | <a href="index.html">Back to All Tools</a></footer>

<script>
    const toolId = "image-compressor"; 
    let favorites = JSON.parse(localStorage.getItem('toolnest_favorites')) || [];

    function updateFavButton() {
        const favBtn = document.getElementById('favBtn');
        if (favorites.includes(toolId)) {
            favBtn.innerText = '⭐ Favorited';
            favBtn.style.borderColor = 'var(--primary)';
        } else {
            favBtn.innerText = '☆ Favorite';
            favBtn.style.borderColor = 'var(--border-color)';
        }
    }

    function toggleCurrentFavorite() {
        if (favorites.includes(toolId)) {
            favorites = favorites.filter(id => id !== toolId);
        } else {
            favorites.push(toolId);
        }
        localStorage.setItem('toolnest_favorites', JSON.stringify(favorites));
        updateFavButton();
    }

    window.onload = function() {
        updateFavButton();
    };

    async function compressImage() {
      const fileInput = document.getElementById('upload-image');
      if (!fileInput.files[0]) {
        alert('Please select an image first!');
        return;
      }
      const options = { maxSizeMB: 1, maxWidthOrHeight: 1920, useWebWorker: true };
      try {
        const compressedFile = await imageCompression(fileInput.files[0], options);
        document.getElementById('size-info').innerText = 
          'Original: ' + (fileInput.files[0].size / 1024).toFixed(2) + ' KB ➔ New: ' + (compressedFile.size / 1024).toFixed(2) + ' KB';
        document.getElementById('download-btn').href = URL.createObjectURL(compressedFile);
        document.getElementById('result').style.display = 'block';
      } catch (e) {
        alert('Error compressing image');
      }
    }

    function toggleTheme() {
        const body = document.body;
        const themeBtn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            themeBtn.innerText = '🌙 Dark Mode';
        } else {
            body.setAttribute('data-theme', 'dark');
            themeBtn.innerText = '☀️ Light Mode';
        }
    }
</script>
</body>
</html>
