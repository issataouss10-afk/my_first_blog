<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker & HEX Code - ToolNest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; }
        nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #1e293b; }
        p.subtitle { color: #64748b; margin-bottom: 25px; }
        
        .color-box-container {
            position: relative;
            width: 100%;
            height: 120px;
            margin-bottom: 20px;
        }

        #colorNative {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .color-display-box {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            background-color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .picker-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .picker-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .picker-row label {
            font-weight: bold;
            width: 60px;
            text-align: left;
        }

        .picker-row input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .picker-row span {
            width: 40px;
            font-family: monospace;
            font-weight: bold;
            text-align: right;
        }

        .code-display {
            background: #f1f5f9;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">← ToolNest</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>🎨 Interactive Color Picker</h1>
            <p class="subtitle">Click the color box or move sliders to pick any color!</p>
            
            <div class="color-box-container">
                <input type="color" id="colorNative" value="#2563eb">
                <div id="preview" class="color-display-box">Click here to choose color 🖌️</div>
            </div>

            <div class="picker-container">
                <div class="picker-row">
                    <label style="color: #ef4444;">Red</label>
                    <input type="range" id="red" min="0" max="255" value="37">
                    <span id="redVal">37</span>
                </div>
                <div class="picker-row">
                    <label style="color: #22c55e;">Green</label>
                    <input type="range" id="green" min="0" max="255" value="99">
                    <span id="greenVal">99</span>
                </div>
                <div class="picker-row">
                    <label style="color: #3b82f6;">Blue</label>
                    <input type="range" id="blue" min="0" max="255" value="235">
                    <span id="blueVal">235</span>
                </div>
            </div>

            <div class="code-display">
                <span>HEX: <span id="hexCode">#2563eb</span></span>
                <button id="copyHexBtn">📋 Copy HEX</button>
            </div>

            <div class="code-display">
                <span>RGB: <span id="rgbCode">rgb(37, 99, 235)</span></span>
                <button id="copyRgbBtn">📋 Copy RGB</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var redInput = document.getElementById('red');
            var greenInput = document.getElementById('green');
            var blueInput = document.getElementById('blue');
            var colorNative = document.getElementById('colorNative');

            var redVal = document.getElementById('redVal');
            var greenVal = document.getElementById('greenVal');
            var blueVal = document.getElementById('blueVal');

            var preview = document.getElementById('preview');
            var hexCode = document.getElementById('hexCode');
            var rgbCode = document.getElementById('rgbCode');

            function rgbToHex(r, g, b) {
                return "#" + [r, g, b].map(function(x) {
                    var hex = parseInt(x).toString(16);
                    return hex.length === 1 ? "0" + hex : hex;
                }).join("");
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }

            function updateFromSliders() {
                var r = redInput.value;
                var g = greenInput.value;
                var b = blueInput.value;

                redVal.innerHTML = r;
                greenVal.innerHTML = g;
                blueVal.innerHTML = b;

                var hex = rgbToHex(r, g, b);
                var rgb = "rgb(" + r + ", " + g + ", " + b + ")";

                preview.style.backgroundColor = hex;
                hexCode.innerHTML = hex;
                rgbCode.innerHTML = rgb;
                colorNative.value = hex;
            }

            function updateFromNative() {
                var hex = colorNative.value;
                var rgb = hexToRgb(hex);
                if (rgb) {
                    redInput.value = rgb.r;
                    greenInput.value = rgb.g;
                    blueInput.value = rgb.b;
                    updateFromSliders();
                }
            }

            redInput.oninput = updateFromSliders;
            greenInput.oninput = updateFromSliders;
            blueInput.oninput = updateFromSliders;

            colorNative.oninput = updateFromNative;

            document.getElementById('copyHexBtn').onclick = function() {
                navigator.clipboard.writeText(hexCode.innerText);
                alert("Copied HEX: " + hexCode.innerText);
            };

            document.getElementById('copyRgbBtn').onclick = function() {
                navigator.clipboard.writeText(rgbCode.innerText);
                alert("Copied RGB: " + rgbCode.innerText);
            };

            updateFromSliders();
        });
    </script>

</body>
</html>
