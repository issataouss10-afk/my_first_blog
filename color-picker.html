<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker & HEX Code - ToolNest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; }
        nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #1e293b; }
        p.subtitle { color: #64748b; margin-bottom: 25px; }
        
        .color-display-box {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #cbd5e1;
            background-color: #2563eb;
        }

        .picker-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .picker-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .picker-row label {
            font-weight: bold;
            width: 60px;
            text-align: left;
        }

        .picker-row input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .picker-row span {
            width: 40px;
            font-family: monospace;
            font-weight: bold;
        }

        .code-display {
            background: #f1f5f9;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">← ToolNest</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>🎨 Custom Color Picker</h1>
            <p class="subtitle">Adjust Red, Green, and Blue sliders to generate custom color codes.</p>
            
            <div id="preview" class="color-display-box"></div>

            <div class="picker-container">
                <div class="picker-row">
                    <label style="color: #ef4444;">Red</label>
                    <input type="range" id="red" min="0" max="255" value="37">
                    <span id="redVal">37</span>
                </div>
                <div class="picker-row">
                    <label style="color: #22c55e;">Green</label>
                    <input type="range" id="green" min="0" max="255" value="99">
                    <span id="greenVal">99</span>
                </div>
                <div class="picker-row">
                    <label style="color: #3b82f6;">Blue</label>
                    <input type="range" id="blue" min="0" max="255" value="235">
                    <span id="blueVal">235</span>
                </div>
            </div>

            <div class="code-display">
                <span>HEX: <span id="hexCode">#2563eb</span></span>
                <button id="copyHexBtn">📋 Copy HEX</button>
            </div>

            <div class="code-display">
                <span>RGB: <span id="rgbCode">rgb(37, 99, 235)</span></span>
                <button id="copyRgbBtn">📋 Copy RGB</button>
            </div>
        </div>
    </div>

    <script>
        const redInput = document.getElementById('red');
        const greenInput = document.getElementById('green');
        const blueInput = document.getElementById('blue');

        const redVal = document.getElementById('redVal');
        const greenVal = document.getElementById('greenVal');
        const blueVal = document.getElementById('blueVal');

        const preview = document.getElementById('preview');
        const hexCode = document.getElementById('hexCode');
        const rgbCode = document.getElementById('rgbCode');

        function updateColor() {
            let r = parseInt(redInput.value);
            let g = parseInt(greenInput.value);
            let b = parseInt(blueInput.value);

            redVal.innerText = r;
            greenVal.innerText = g;
            blueVal.innerText = b;

            let rgbText = rgb(${r}, ${g}, ${b});
            let hexText = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

            preview.style.backgroundColor = rgbText;
            rgbCode.innerText = rgbText;
            hexCode.innerText = hexText;
        }

        // ربط الأحداث مباشرة للضمان
        [redInput, greenInput, blueInput].forEach(input => {
            input.addEventListener('input', updateColor);
            input.addEventListener('change', updateColor);
        });

        document.getElementById('copyHexBtn').onclick = function() {
            navigator.clipboard.writeText(hexCode.innerText);
            alert("Copied HEX: " + hexCode.innerText);
        };

        document.getElementById('copyRgbBtn').onclick = function() {
            navigator.clipboard.writeText(rgbCode.innerText);
            alert("Copied RGB: " + rgbCode.innerText);
        };

        updateColor();
    </script>

</body>
</html>
