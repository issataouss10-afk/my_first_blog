<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToolNest</title>
    <meta name="description" content="Get in touch with the ToolNest team for feedback, support, or inquiries.">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RLN0M7YFJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4RLN0M7YFJ');
    </script>

    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
        }
        [data-theme="dark"] {
            --primary: #3b82f6;
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Segoe UI, Tahoma, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { width: min(1180px, 92%); margin: auto; }
        .site-header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .header-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .logo { font-size: 1.3rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; gap: 10px; align-items: center; }
        .main-nav { display: flex; gap: 20px; align-items: center; }
        .main-nav a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; }
        .main-nav a:hover { color: var(--primary); }
        
        .contact-section { max-width: 600px; margin: 40px auto; background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .contact-section h1 { margin-bottom: 10px; font-size: 1.8rem; color: var(--text); }
        .contact-section p { color: var(--muted); margin-bottom: 25px; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
        .form-group textarea { height: 150px; resize: vertical; }
        
        .submit-btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; }
        .submit-btn:hover { background: var(--primary-dark); }
        
        .site-footer { margin-top: 40px; padding: 30px 0; border-top: 1px solid var(--border); text-align: center; color: var(--muted); background: var(--card); font-size: 13px; }
        .site-footer a { color: var(--primary); margin: 0 10px; text-decoration: none; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo"><span>🧰</span><span>ToolNest</span></a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="contact.html" style="color: var(--primary);">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="contact-section">
            <h1>Contact Us</h1>
            <p>Have a question, suggestion, or found a bug? Send us a message and we'll get back to you as soon as possible.</p>
            
            <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent successfully.');">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" required placeholder="Enter your email address">
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" required placeholder="How can we help you?"></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 ToolNest. All rights reserved.</p>
            <nav style="margin-top: 8px;">
                <a href="about.html">About Us</a>
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </footer>

</body>
</html>
