<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - ToolNest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; }
        nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #1e293b; }
        p.subtitle { color: #64748b; margin-bottom: 25px; }
        .result-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1.1rem; outline: none; text-align: center; font-weight: bold; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .options { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .option-row { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">← ToolNest</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>🔐 Strong Password Generator</h1>
            <p class="subtitle">Generate secure, random passwords instantly.</p>
            
            <div class="result-box">
                <input type="text" id="passInput" readonly placeholder="Click Generate">
                <button onclick="copyPass()">📋 Copy</button>
            </div>

            <div class="options">
                <div class="option-row">
                    <label>Password Length:</label>
                    <input type="number" id="passLength" value="12" min="6" max="32" style="width: 60px; padding: 5px; text-align: center;">
                </div>
            </div>

            <button onclick="generatePass()" style="width: 100%;">⚡ Generate Password</button>
        </div>
    </div>

    <script>
        function generatePass() {
            let length = document.getElementById('passLength').value;
            let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=";
            let password = "";
            for (let i = 0; i < length; i++) {
                let randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }
            document.getElementById('passInput').value = password;
        }

        function copyPass() {
            let input = document.getElementById('passInput');
            if(input.value) {
                input.select();
                navigator.clipboard.writeText(input.value);
                alert("Password copied to clipboard!");
            }
        }

        // توليد كلمة سر أول ما تفتح الصفحة
        generatePass();
    </script>

</body>
</html>
