<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fancy Text & Bio Generator - ToolNest</title>
  <meta name="description" content="Generate stylish text, cool fonts, and symbols for Instagram bio, TikTok, WhatsApp, and gaming usernames for free.">
  <meta name="keywords" content="fancy text generator, stylish fonts, instagram bio fonts, copy and paste fonts, cool text generator">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RLN0M7YFJ"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-4RLN0M7YFJ');

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
    nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
    header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; text-align: center; padding: 40px 20px; }
    header h1 { font-size: 2.2rem; margin-bottom: 10px; }
    header p { opacity: 0.9; max-width: 600px; margin: 0 auto; font-size: 1.1rem; }
    
    .container { max-width: 800px; margin: -30px auto 40px auto; padding: 0 20px; width: 100%; }
    .tool-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    input[type="text"] { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; margin-bottom: 25px; transition: 0.3s; }
    input[type="text"]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
    
    .results-list { display: flex; flex-direction: column; gap: 12px; }
    .font-row { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 18px; border-radius: 8px; border: 1px solid #e2e8f0; gap: 10px; }
    .font-text { font-size: 1.2rem; word-break: break-all; color: #1e293b; }
    .copy-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.2s; }
    .copy-btn:hover { background: #1d4ed8; }

    footer { background: #0f172a; color: white; text-align: center; padding: 20px; margin-top: auto; font-size: 0.9rem; }
    footer a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">ToolNest</a>
  </nav>

  <header>
    <h1>Fancy Text & Bio Generator</h1>
    <p>Convert your normal text into cool, stylish fonts for Instagram, TikTok, WhatsApp, and gaming profiles!</p>
  </header>

  <div class="container">
    <div class="tool-card">
      <input type="text" id="userInput" placeholder="Type or paste your text here..." oninput="generateFonts()">
      <div id="results" class="results-list"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ToolNest. All rights reserved. | <a href="index.html">Back to All Tools</a></p>
  </footer>

  <script>
    const fontStyles = [
      { transform: text => text.replace(/[a-zA-Z0-9]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c >= 'a' ? 120205 : c >= 'A' ? 120199 : 120764))) },
      { transform: text => text.replace(/[a-zA-Z]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c >= 'a' ? 120257 : 120251))) },
      { transform: text => text.replace(/[a-zA-Z]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c >= 'a' ? 119977 : 119971))) },
      { transform: text => text.replace(/[a-zA-Z0-9]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c >= 'a' ? 120361 : c >= 'A' ? 120355 : 120794))) },
      { transform: text => text.replace(/[a-zA-Z0-9]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c >= 'a' ? 9327 : c >= 'A' ? 9333 : 9263))) },
      { transform: text => text.replace(/[a-zA-Z]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c >= 'a' ? 127247 : 127215))) },
      { transform: text => `░${text.split('').join('·')}░` },
      { transform: text => `★彡 [${text}] 彡★` },
      { transform: text => `✍️✨ ${text} ✨✍️` }
    ];

    function generateFonts() {
      const input = document.getElementById('userInput').value;
      const container = document.getElementById('results');
      container.innerHTML = '';
      const text = input.trim() === '' ? 'ToolNest' : input;

      fontStyles.forEach(style => {
        try {
          const styledText = style.transform(text);
          const row = document.createElement('div');
          row.className = 'font-row';

          const span = document.createElement('span');
          span.className = 'font-text';
          span.innerText = styledText;

          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.innerText = 'Copy';
          btn.onclick = () => {
            navigator.clipboard.writeText(styledText);
            btn.innerText = 'Copied!';
            btn.style.background = '#059669';
            setTimeout(() => {
              btn.innerText = 'Copy';
              btn.style.background = '#2563eb';
            }, 1500);
          };

          row.appendChild(span);
          row.appendChild(btn);
          container.appendChild(row);
        } catch(e){}
      });
    }

    generateFonts();
  </script>
</body>
</html>
