<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder & Decoder - ToolNest</title>
  <meta name="description" content="Encode and decode text to and from Base64 format instantly for free.">
  <meta name="robots" content="index, follow">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RLN0M7YFJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4RLN0M7YFJ');

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
    nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
    header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; text-align: center; padding: 40px 20px; }
    header h1 { font-size: 2.2rem; margin-bottom: 10px; }
    header p { opacity: 0.9; max-width: 600px; margin: 0 auto; font-size: 1.1rem; }
    
    .container { max-width: 800px; margin: -30px auto 40px auto; padding: 0 20px; width: 100%; }
    .tool-card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
    textarea { width: 100%; height: 150px; padding: 15px; font-size: 0.95rem; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; background: #fff; resize: vertical; transition: 0.3s; }
    textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }

    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .action-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; flex: 1; }
    .action-btn:hover { background: #1d4ed8; }
    .action-btn.secondary { background: #64748b; }
    .action-btn.secondary:hover { background: #475569; }

    footer { background: #0f172a; color: white; text-align: center; padding: 20px; margin-top: auto; font-size: 0.9rem; }
    footer a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">ToolNest</a>
  </nav>

  <header>
    <h1>Base64 Encoder & Decoder</h1>
    <p>Encode text to Base64 or decode Base64 back to plain text instantly.</p>
  </header>

  <div class="container">
    <div class="tool-card">
      <div class="input-group">
        <label for="inputText">Input Text:</label>
        <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
      </div>

      <div class="btn-group">
        <button class="action-btn" onclick="encodeBase64()">Encode to Base64</button>
        <button class="action-btn secondary" onclick="decodeBase64()">Decode from Base64</button>
      </div>

      <div class="input-group">
        <label for="outputText">Output Result:</label>
        <textarea id="outputText" readonly placeholder="Result will appear here..." style="background: #f1f5f9;"></textarea>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ToolNest. All rights reserved. | <a href="index.html">Back to All Tools</a></p>
  </footer>

  <script>
    function encodeBase64() {
      const input = document.getElementById('inputText').value;
      try {
        // btoa supports ASCII, encodeURIComponent handles UTF-8 properly
        const encoded = btoa(encodeURIComponent(input).replace(/%([0-9A-F]{2})/g, function(match, p1) {
          return String.fromCharCode('0x' + p1);
        }));
        document.getElementById('outputText').value = encoded;
      } catch (e) {
        alert('Error encoding text.');
      }
    }

    function decodeBase64() {
      const input = document.getElementById('inputText').value;
      try {
        const decoded = decodeURIComponent(atob(input).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        document.getElementById('outputText').value = decoded;
      } catch (e) {
        alert('Invalid Base64 string.');
      }
    }
  </script>
</body>
</html>
