<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - ToolNest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; }
        nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #1e293b; }
        p.subtitle { color: #64748b; margin-bottom: 25px; }
        input[type="date"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 20px; outline: none; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 25px; text-align: center; }
        .result-box { background: #f1f5f9; padding: 15px; border-radius: 8px; }
        .number { font-size: 1.5rem; font-weight: bold; color: #2563eb; }
        .label { font-size: 0.85rem; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">← ToolNest</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>🎂 Age Calculator</h1>
            <p class="subtitle">Select your birth date to calculate your exact age.</p>
            
            <input type="date" id="birthDate">
            <button onclick="calculateAge()">Calculate Age</button>

            <div class="result-grid" id="resultGrid" style="display: none;">
                <div class="result-box">
                    <div class="number" id="years">0</div>
                    <div class="label">Years</div>
                </div>
                <div class="result-box">
                    <div class="number" id="months">0</div>
                    <div class="label">Months</div>
                </div>
                <div class="result-box">
                    <div class="number" id="days">0</div>
                    <div class="label">Days</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateAge() {
            let birthInput = document.getElementById('birthDate').value;
            if (!birthInput) return alert("Please select a birth date!");

            let birthDate = new Date(birthInput);
            let today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('resultGrid').style.display = 'grid';
        }
    </script>

</body>
</html>
