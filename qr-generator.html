<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Forge - ToolNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      :root {
        --bg: #0a0814;
        --surface: #141126;
        --surface-2: #1c1734;
        --surface-3: #241d42;
        --border: #2a2447;
        --border-soft: #1f1a38;
        --text: #f1edf9;
        --text-muted: #948bb5;
        --text-faint: #5f577f;
        --violet: #a855f7;
        --violet-soft: rgba(168, 85, 247, 0.14);
        --magenta: #ec4899;
        --deep-violet: #7c3aed;
        --cyan-glow: #67e8f9;
        --gradient-brand: linear-gradient(135deg, var(--violet), var(--magenta));
        --gradient-ring: conic-gradient(from 0deg, var(--violet), var(--magenta), var(--deep-violet), var(--violet));
        --radius-lg: 22px;
        --radius-md: 14px;
        --radius-sm: 9px;
        --shadow-card: 0 30px 80px -30px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        --shadow-glow: 0 0 40px -8px rgba(168, 85, 247, 0.45);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { box-sizing: border-box; }
      html { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
      }

      body::before, body::after {
        content: "";
        position: fixed;
        width: 46vw;
        height: 46vw;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.22;
        z-index: 0;
        pointer-events: none;
      }
      body::before { background: var(--violet); top: -14vw; left: -10vw; }
      body::after { background: var(--magenta); bottom: -18vw; right: -12vw; opacity: 0.16; }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin: 0 auto;
        padding: 56px 24px 40px;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }

      .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 11px;
        background: var(--gradient-brand);
        display: grid; place-items: center;
        box-shadow: var(--shadow-glow); flex-shrink: 0;
      }
      .brand-mark svg { width: 20px; height: 20px; stroke: #0a0814; fill: none; stroke-width: 2; }
      .brand-name {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1;
      }
      .brand-name span {
        display: block; font-family: "Inter", sans-serif; font-weight: 500;
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--text-faint); margin-top: 4px;
      }

      .header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
      .pill {
        font-size: 12px; font-weight: 600; color: var(--text-muted);
        border: 1px solid var(--border); background: var(--surface);
        padding: 7px 13px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
      }
      .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 8px var(--violet); }

      .hero-copy { max-width: 640px; margin-bottom: 34px; }
      .hero-copy h1 {
        font-family: "Space Grotesk", sans-serif; font-size: clamp(28px, 4vw, 38px);
        font-weight: 700; letter-spacing: -0.02em; margin: 0 0 10px; line-height: 1.1;
      }
      .hero-copy h1 em {
        font-style: normal; background: var(--gradient-brand);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .hero-copy p { margin: 0; color: var(--text-muted); font-size: 15px; line-height: 1.6; }

      .tool-card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden;
      }

      .tabs {
        display: flex; gap: 4px; padding: 14px 14px 0;
        border-bottom: 1px solid var(--border-soft); overflow-x: auto; scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab {
        position: relative; display: flex; align-items: center; gap: 9px;
        padding: 12px 18px 14px; background: transparent; border: none;
        color: var(--text-faint); font-family: "Space Grotesk", sans-serif;
        font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 10px 10px 0 0;
        transition: color 0.2s, background 0.2s; white-space: nowrap;
      }
      .tab svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
      .tab:hover { color: var(--text-muted); background: rgba(255, 255, 255, 0.02); }
      .tab.active { color: var(--text); background: var(--surface-2); }
      .tab::after {
        content: ""; position: absolute; left: 14px; right: 14px; bottom: 0;
        height: 2px; border-radius: 2px; background: var(--gradient-brand);
        transform: scaleX(0); transition: transform 0.25s var(--ease);
      }
      .tab.active::after { transform: scaleX(1); }

      .tool-body { display: grid; grid-template-columns: 1.15fr 1fr; }
      @media (max-width: 860px) { .tool-body { grid-template-columns: 1fr; } }

      .panel-inputs { padding: 30px 32px 34px; border-right: 1px solid var(--border-soft); }
      @media (max-width: 860px) { .panel-inputs { border-right: none; border-bottom: 1px solid var(--border-soft); } }

      .field-group { display: none; flex-direction: column; gap: 16px; }
      .field-group.active { display: flex; }

      .field { display: flex; flex-direction: column; gap: 7px; }
      .field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

      input[type="text"], input[type="url"], input[type="email"], input[type="tel"], textarea, select {
        width: 100%; background: var(--surface-2); border: 1px solid var(--border);
        color: var(--text); font-family: "Inter", sans-serif; font-size: 14.5px;
        padding: 12px 14px; border-radius: var(--radius-sm); outline: none;
      }
      input:focus, textarea:focus, select:focus { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-soft); }
      textarea { resize: vertical; min-height: 90px; font-family: "JetBrains Mono", monospace; font-size: 13.5px; }

      .panel-preview {
        padding: 30px 32px 34px; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start; gap: 20px;
        background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.06), transparent 60%);
      }
      .preview-label { align-self: flex-start; font-size: 12.5px; font-weight: 600; color: var(--text-muted); }

      .qr-stage { position: relative; width: min(240px, 60vw); height: min(240px, 60vw); display: grid; place-items: center; }
      .qr-ring {
        position: absolute; inset: -10px; border-radius: 26px;
        background: var(--gradient-ring); animation: spin 7s linear infinite; opacity: 0.85;
      }
      .qr-ring::after { content: ""; position: absolute; inset: 3px; border-radius: 23px; background: var(--surface); }
      .qr-frame {
        position: relative; width: 100%; height: 100%; border-radius: 20px;
        background: #ffffff; display: grid; place-items: center; overflow: hidden;
        box-shadow: 0 20px 50px -18px rgba(168, 85, 247, 0.55);
      }
      #qr-canvas-holder img, #qr-canvas-holder canvas { display: block; border-radius: 6px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .preview-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
      .btn {
        font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 14px;
        border-radius: var(--radius-sm); padding: 13px 18px; border: 1px solid transparent;
        cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: transform 0.15s, box-shadow 0.2s, background 0.2s; text-decoration: none;
      }
      .btn-primary { background: var(--gradient-brand); color: #0a0814; box-shadow: var(--shadow-glow); }
      .btn-primary:hover { transform: translateY(-1px); }
      
      .site-footer {
        margin-top: 30px; display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap; color: var(--text-faint); font-size: 12.5px;
      }
      .site-footer a { color: var(--text-muted); text-decoration: none; }
      .site-footer a:hover { color: var(--violet); }
    </style>
</head>
<body>

    <div class="wrap">
        <header class="site-header">
            <a href="index.html" class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div class="brand-name">
                    ToolNest ⚡
                    <span>QR Forge</span>
                </div>
            </a>
            <div class="header-badges">
                <div class="pill"><span class="pill-dot"></span>Client-Side Secure</div>
            </div>
        </header>

        <div class="hero-copy">
            <h1>Advanced <em>QR Code</em> Generator</h1>
            <p>Create high-quality, fully custom QR codes instantly for URLs, plain text, emails, or phone numbers.</p>
        </div>

        <div class="tool-card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('url', event)">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                    URL
                </button>
                <button class="tab" onclick="switchTab('text', event)">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                    Plain Text
                </button>
                <button class="tab" onclick="switchTab('email', event)">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    Email
                </button>
                <button class="tab" onclick="switchTab('phone', event)">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    Phone
                </button>
            </div>

            <div class="tool-body">
                <div class="panel-inputs">
                    <!-- URL Tab -->
                    <div id="group-url" class="field-group active">
                        <div class="field">
                            <label>Website URL</label>
                            <input type="url" id="input-url" placeholder="https://example.com" value="https://example.com" oninput="generateQR()">
                        </div>
                    </div>

                    <!-- Text Tab -->
                    <div id="group-text" class="field-group">
                        <div class="field">
                            <label>Plain Text Message</label>
                            <textarea id="input-text" placeholder="Type your message here..." oninput="generateQR()"></textarea>
                        </div>
                    </div>

                    <!-- Email Tab -->
                    <div id="group-email" class="field-group">
                        <div class="field">
                            <label>Recipient Email</label>
                            <input type="email" id="input-email" placeholder="name@example.com" oninput="generateQR()">
                        </div>
                        <div class="field">
                            <label>Subject <span class="opt">(Optional)</span></label>
                            <input type="text" id="input-email-subj" placeholder="Hello" oninput="generateQR()">
                        </div>
                    </div>

                    <!-- Phone Tab -->
                    <div id="group-phone" class="field-group">
                        <div class="field">
                            <label>Phone Number</label>
                            <input type="tel" id="input-phone" placeholder="+1234567890" oninput="generateQR()">
                        </div>
                    </div>
                </div>

                <div class="panel-preview">
                    <div class="preview-label">Live Preview</div>
                    <div class="qr-stage">
                        <div class="qr-ring"></div>
                        <div class="qr-frame">
                            <div id="qr-canvas-holder"></div>
                        </div>
                    </div>
                    <div class="preview-actions">
                        <button class="btn btn-primary" onclick="downloadQR()">
                            <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            Download QR Code (PNG)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <div>&copy; 2026 ToolNest • Professional Developer Utilities</div>
            <a href="index.html">← Back to All Tools</a>
        </footer>
    </div>

    <script>
        let currentTab = 'url';

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.field-group').forEach(g => g.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById('group-' + tabName).classList.add('active');
            currentTab = tabName;
            generateQR();
        }

        function getQRData() {
            if (currentTab === 'url') {
                return document.getElementById('input-url').value || 'https://example.com';
            } else if (currentTab === 'text') {
                return document.getElementById('input-text').value || 'ToolNest QR Forge';
            } else if (currentTab === 'email') {
                const email = document.getElementById('input-email').value || 'test@example.com';
                const subj = document.getElementById('input-email-subj').value;
                return `mailto:${email}${subj ? '?subject=' + encodeURIComponent(subj) : ''}`;
            } else if (currentTab === 'phone') {
                const phone = document.getElementById('input-phone').value || '+1234567890';
                return `tel:${phone}`;
            }
            return 'https://example.com';
        }

        function generateQR() {
            const holder = document.getElementById('qr-canvas-holder');
            holder.innerHTML = '';
            const data = getQRData();
            
            new QRCode(holder, {
                text: data,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const img = document.querySelector('#qr-canvas-holder img') || document.querySelector('#qr-canvas-holder canvas');
            if (!img) return;
            
            let imageUrl = img.src;
            if (!imageUrl && img.tagName === 'CANVAS') {
                imageUrl = img.toDataURL("image/png");
            }

            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = 'toolnest-qr.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = function() {
            generateQR();
        };
    </script>
</body>
</html>
