<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR Code Generator - ToolNest</title>
    <meta name="description" content="Create ultra-modern custom QR codes instantly with professional styling.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-white/10 backdrop-blur-md bg-slate-900/50 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-shapes"></i> ToolNest
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-300 hover:text-white transition flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/10 hover:bg-white/10">
                <i class="fa-solid fa-arrow-left"></i> Home
            </a>
        </div>
    </header>

    <!-- Main Tool Section -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        
        <!-- Title -->
        <div class="text-center mb-10">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/20 uppercase tracking-widest mb-3 inline-block">Pro Utility</span>
            <h1 class="text-4xl sm:text-5xl font-black tracking-tight mb-3 text-white">QR Code Studio</h1>
            <p class="text-slate-400 text-base max-w-lg mx-auto">Transform your links and text into high-end scannable assets in real-time.</p>
        </div>

        <!-- Tool Card -->
        <div class="bg-slate-800/60 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-white/10 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            
            <!-- Input Area -->
            <div class="space-y-6">
                <div>
                    <label for="qr-input" class="block text-sm font-semibold text-slate-300 mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-pen-nib text-indigo-400"></i> Enter Content or URL
                    </label>
                    <textarea id="qr-input" rows="4" placeholder="https://yourwebsite.com" class="w-full bg-slate-900/80 text-slate-100 px-4 py-3.5 rounded-2xl border border-slate-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm placeholder:text-slate-600 shadow-inner"></textarea>
                </div>
                <button onclick="generateQR()" class="w-full bg-gradient-to-r from-indigo-500 to-cyan-500 text-white font-bold py-4 rounded-2xl hover:opacity-90 transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transform active:scale-[0.98]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate QR Code
                </button>
            </div>

            <!-- Output Area -->
            <div class="flex flex-col items-center justify-center bg-slate-900/80 p-8 rounded-2xl border border-white/5 relative group">
                <div id="qrcode" class="mb-5 bg-white p-4 rounded-xl shadow-2xl flex items-center justify-center min-h-[180px] min-w-[180px] transition transform group-hover:scale-105">
                    <p class="text-slate-400 text-xs text-center">Your QR will materialize here</p>
                </div>
                <button id="download-btn" onclick="downloadQR()" class="hidden bg-indigo-600 text-white text-sm font-semibold px-6 py-3 rounded-xl hover:bg-indigo-500 transition flex items-center gap-2 shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Download HD PNG
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-6 text-center text-xs text-slate-500 bg-slate-900/50">
        <p>© 2026 ToolNest. Built for creators & developers.</p>
    </footer>

    <!-- Script -->
    <script>
        function generateQR() {
            const inputVal = document.getElementById('qr-input').value.trim();
            const qrContainer = document.getElementById('qrcode');
            const downloadBtn = document.getElementById('download-btn');

            if (!inputVal) {
                alert('Please type something first!');
                return;
            }

            qrContainer.innerHTML = '';

            new QRCode(qrContainer, {
                text: inputVal,
                width: 180,
                height: 180,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            downloadBtn.classList.remove('hidden');
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
            if (!img) return;

            let imageUrl = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = 'toolnest-pro-qrcode.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
