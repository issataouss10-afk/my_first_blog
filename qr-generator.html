<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator - ToolNest</title>
    <meta name="description" content="Generate free downloadable QR codes instantly for websites, links, and text.">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        nav {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
        .back-link { color: #64748b; text-decoration: none; font-weight: 600; font-size: 14px; }
        .back-link:hover { color: #2563eb; }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .tool-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
        }
        h1 { margin-top: 0; color: #1e293b; font-size: 1.8rem; }
        p.desc { color: #64748b; margin-bottom: 25px; line-height: 1.5; }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #2563eb; }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
        }
        button:hover { background: #1d4ed8; }

        #qrcode-box {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #qrcode img, #qrcode canvas {
            padding: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        
        footer { margin-top: 60px; text-align: center; color: #94a3b8; font-size: 14px; padding: 20px; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">ToolNest</a>
    <a href="index.html" class="back-link">← Back to All Tools</a>
</nav>

<div class="container">
    <div class="tool-box">
        <h1>📱 Online QR Code Generator</h1>
        <p class="desc">Enter any URL or plain text below to instantly create a high-quality QR code that you can download and share.</p>
        
        <input type="text" id="qrText" placeholder="e.g. https://mywebsite.com or enter any text...">
        <div>
            <button onclick="generateQRCode()">Generate QR Code</button>
        </div>

        <div id="qrcode-box">
            <div id="qrcode"></div>
            <button id="downloadBtn" style="display:none; background:#475569;" onclick="downloadQR()">Download PNG Image</button>
        </div>
    </div>
</div>

<footer>© 2026 ToolNest • Free Online Utilities</footer>

<script>
    function generateQRCode() {
        const text = document.getElementById('qrText').value.trim();
        const container = document.getElementById('qrcode');
        if (!text) return alert('Please enter a URL or text!');
        
        container.innerHTML = '';
        new QRCode(container, { text: text, width: 180, height: 180 });
        document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function downloadQR() {
        const img = document.querySelector('#qrcode img');
        const canvas = document.querySelector('#qrcode canvas');
        let imageSrc = img && img.src ? img.src : (canvas ? canvas.toDataURL("image/png") : "");
        if (imageSrc) {
            const link = document.createElement('a');
            link.href = imageSrc;
            link.download = 'toolnest-qrcode.png';
            link.click();
        }
    }
</script>

</body>
</html>
