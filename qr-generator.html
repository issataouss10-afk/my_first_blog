<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator - ToolNest</title>
    <meta name="description" content="Generate free downloadable QR codes instantly for websites, links, and text.">
    
    <!-- ربط ملف الـ CSS المشترك والفخم -->
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة توليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-theme="dark">

<nav>
    <a href="index.html" class="logo">ToolNest ⚡</a>
    <div class="nav-actions">
      <button class="fav-nav-btn" id="favBtn" onclick="toggleCurrentFavorite()">☆ Favorite</button>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
    </div>
</nav>

<div class="container">
    <div class="tool-card">
        <h1>📱 Online QR Code Generator</h1>
        <p style="color: var(--card-text); margin-bottom: 25px; line-height: 1.5;">Enter any URL or plain text below to instantly create a high-quality QR code that you can download and share.</p>
        
        <input type="text" id="qrText" placeholder="e.g. https://mywebsite.com or enter any text...">
        <div>
            <button onclick="generateQRCode()">Generate QR Code</button>
        </div>

        <div id="qrcode-box" style="margin-top: 25px; display: flex; flex-direction: column; align-items: center;">
            <div id="qrcode" style="margin-bottom: 15px;"></div>
            <button id="downloadBtn" style="display:none; background: var(--primary);" onclick="downloadQR()">Download PNG Image</button>
        </div>
    </div>
</div>

<footer>© 2026 ToolNest • Free Online Utilities | <a href="index.html">Back to All Tools</a></footer>

<script>
    // معرف الأداة الخاص بالمفضلة
    const toolId = "qr-generator"; 
    let favorites = JSON.parse(localStorage.getItem('toolnest_favorites')) || [];

    function updateFavButton() {
        const favBtn = document.getElementById('favBtn');
        if (favorites.includes(toolId)) {
            favBtn.innerText = '⭐ Favorited';
            favBtn.style.borderColor = 'var(--primary)';
        } else {
            favBtn.innerText = '☆ Favorite';
            favBtn.style.borderColor = 'var(--border-color)';
        }
    }

    function toggleCurrentFavorite() {
        if (favorites.includes(toolId)) {
            favorites = favorites.filter(id => id !== toolId);
        } else {
            favorites.push(toolId);
        }
        localStorage.setItem('toolnest_favorites', JSON.stringify(favorites));
        updateFavButton();
    }

    window.onload = function() {
        updateFavButton();
    };

    function generateQRCode() {
        const text = document.getElementById('qrText').value.trim();
        const container = document.getElementById('qrcode');
        if (!text) return alert('Please enter a URL or text!');
        
        container.innerHTML = '';
        new QRCode(container, { text: text, width: 180, height: 180 });
        document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function downloadQR() {
        const img = document.querySelector('#qrcode img');
        const canvas = document.querySelector('#qrcode canvas');
        let imageSrc = img && img.src ? img.src : (canvas ? canvas.toDataURL("image/png") : "");
        if (imageSrc) {
            const link = document.createElement('a');
            link.href = imageSrc;
            link.download = 'toolnest-qrcode.png';
            link.click();
        }
    }

    function toggleTheme() {
        const body = document.body;
        const themeBtn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            themeBtn.innerText = '🌙 Dark Mode';
        } else {
            body.setAttribute('data-theme', 'dark');
            themeBtn.innerText = '☀️ Light Mode';
        }
    }
</script>

</body>
</html>
