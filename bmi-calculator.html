<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة كتلة الجسم الاحترافية (BMI) - ToolNest</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar style matching ToolNest */
        nav { background: #ffffff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4f46e5; text-decoration: none; }
        .back-btn { color: #64748b; text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s; }
        .back-btn:hover { color: #4f46e5; }

        /* Main Container */
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 35px; border: 1px solid #f1f5f9; }
        
        h1 { font-size: 1.8rem; color: #0f172a; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #64748b; text-align: center; margin-bottom: 30px; font-size: 0.95rem; }

        .input-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #334155; }
        
        .input-with-unit { position: relative; display: flex; align-items: center; }
        input[type="number"] { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1.1rem; outline: none; transition: all 0.3s; background: #fafafa; }
        input[type="number"]:focus { border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .unit-badge { position: absolute; left: 15px; color: #94a3b8; font-weight: 600; font-size: 0.95rem; }

        .calc-btn { background: #4f46e5; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s, transform 0.1s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); margin-top: 10px; }
        .calc-btn:hover { background: #4338ca; }
        .calc-btn:active { transform: scale(0.99); }

        /* Results Section Pro */
        .result-box { margin-top: 30px; padding: 25px; border-radius: 14px; background: #f8fafc; display: none; border-right: 6px solid #4f46e5; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .bmi-score { font-size: 2.2rem; font-weight: 800; color: #1e293b; }
        .bmi-status-badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

        /* Visual Scale Bar */
        .scale-bar-container { margin: 20px 0; }
        .scale-bar { height: 10px; width: 100%; background: #e2e8f0; border-radius: 5px; display: flex; overflow: hidden; position: relative; }
        .scale-segment { height: 100%; }
        
        .range-info { font-size: 0.95rem; color: #475569; margin-top: 15px; line-height: 1.6; background: #ffffff; padding: 12px 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .range-info strong { color: #0f172a; }

        footer { text-align: center; padding: 25px; color: #94a3b8; font-size: 0.85rem; border-top: 1px solid #e2e8f0; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ToolNest 🧰</a>
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>حاسبة كتلة الجسم المتقدمة</h1>
            <p class="subtitle">احسب مؤشر كتلة جسمك بدقة، وتعرف على الوزن الصحي المناسب لطولك.</p>

            <div class="input-group">
                <label for="height">طولك:</label>
                <div class="input-with-unit">
                    <input type="number" id="height" placeholder="مثال: 174" min="50" max="250">
                    <span class="unit-badge">سم (cm)</span>
                </div>
            </div>

            <div class="input-group">
                <label for="weight">وزنك الحالي:</label>
                <div class="input-with-unit">
                    <input type="number" id="weight" placeholder="مثال: 55" min="20" max="300">
                    <span class="unit-badge">كغ (kg)</span>
                </div>
            </div>

            <button class="calc-btn" onclick="calculateProBMI()">احسب النتيجة الاحترافية</button>

            <div class="result-box" id="resultBox">
                <div class="result-header">
                    <div>
                        <span style="font-size: 0.85rem; color: #64748b; display: block;">مؤشر الكتلة (BMI)</span>
                        <div class="bmi-score" id="bmiValue">0.0</div>
                    </div>
                    <div id="statusBadge" class="bmi-status-badge">-</div>
                </div>

                <!-- Color scale bar -->
                <div class="scale-bar-container">
                    <div class="scale-bar">
                        <div class="scale-segment" style="width: 25%; background: #38bdf8;" title="نحيف"></div>
                        <div class="scale-segment" style="width: 30%; background: #10b981;" title="طبيعي"></div>
                        <div class="scale-segment" style="width: 25%; background: #f59e0b;" title="وزن زائد"></div>
                        <div class="scale-segment" style="width: 20%; background: #ef4444;" title="سمنة"></div>
                    </div>
                </div>

                <div class="range-info" id="rangeDetails">
                    <!-- Dynamic weight range info -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ToolNest. جميع الحقوق محفوظة - صُمم بحرافية عالية.</p>
    </footer>

    <script>
        function calculateProBMI() {
            const hInput = document.getElementById('height').value;
            const wInput = document.getElementById('weight').value;
            const resultBox = document.getElementById('resultBox');
            const bmiValueEl = document.getElementById('bmiValue');
            const statusBadge = document.getElementById('statusBadge');
            const rangeDetails = document.getElementById('rangeDetails');

            if (!hInput || !wInput || hInput <= 0 || wInput <= 0) {
                alert('المرجو إدخال الطول والوزن بشكل صحيح!');
                return;
            }

            const heightM = hInput / 100;
            const bmi = (wInput / (heightM * heightM)).toFixed(1);

            // Healthy range calculation (BMI 18.5 to 24.9)
            const minWeight = (18.5 * (heightM * heightM)).toFixed(1);
            const maxWeight = (24.9 * (heightM * heightM)).toFixed(1);

            let statusText = '';
            let badgeBg = '';
            let badgeColor = '';
            let borderColor = '';
            let advice = '';

            if (bmi < 18.5) {
                statusText = 'وزن أقل من الطبيعي (نحيف)';
                badgeBg = '#e0f2fe'; badgeColor = '#0284c7'; borderColor = '#38bdf8';
                advice = `تحتاج لزيادة بعض الوزن للوصول للنطاق الصحي. الوزن المثالي المناسب لطولك يتراوح ما بين <strong>${minWeight} كغ</strong> و <strong>${maxWeight} كغ</strong>.`;
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                statusText = 'وزن صحي ومثالي 🌟';
                badgeBg = '#dcfce7'; badgeColor = '#15803d'; borderColor = '#10b981';
                advice = `هنيئاً! وزنك الحالي يعتبر في النطاق الصحي والمثالي لطولك (المدى الصحي بين <strong>${minWeight} كغ</strong> و <strong>${maxWeight} كغ</strong>). حافظ على لياقتك!`;
            } else if (bmi >= 25 && bmi <= 29.9) {
                statusText = 'وزن زائد';
                badgeBg = '#fef3c7'; badgeColor = '#b45309'; borderColor = '#f59e0b';
                advice = `لديك زيادة طفيفة في الوزن. النطاق الصحي الموصى به لطولك هو بين <strong>${minWeight} كغ</strong> و <strong>${maxWeight} كغ</strong>.`;
            } else {
                statusText = 'سمنة مفرطة';
                badgeBg = '#fee2e2'; badgeColor = '#b91c1c'; borderColor = '#ef4444';
                advice = `يُعاني مؤشر الكتلة من ارتفاع ملحوظ. يُنصح باتباع نظام غذائي صحي للوصول للوزن الطبيعي (بين <strong>${minWeight} كغ</strong> و <strong>${maxWeight} كغ</strong>).`;
            }

            bmiValueEl.innerText = bmi;
            statusBadge.innerText = statusText;
            statusBadge.style.backgroundColor = badgeBg;
            statusBadge.style.color = badgeColor;
            resultBox.style.borderRightColor = borderColor;
            
            rangeDetails.innerHTML = advice;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
