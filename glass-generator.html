<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glassmorphism Generator - ToolNest</title>
    <meta name="description" content="Generate CSS glassmorphism effects with live preview. Free online tool.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center w-full">
            <a href="index.html" class="text-xl font-bold text-blue-400">ToolNest</a>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition">🏠 Home</a>
        </div>
    </header>

    <!-- Main Content Centered -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-4xl w-full mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-800 p-8 rounded-2xl border border-slate-700 items-center shadow-lg">
            <!-- Controls -->
            <div class="space-y-4">
                <h1 class="text-xl font-bold text-white mb-2">Glassmorphism Generator</h1>
                <div>
                    <label class="block text-xs font-medium mb-1">Blur: <span id="blurVal">10</span>px</label>
                    <input type="range" id="blurRange" min="0" max="40" value="10" class="w-full accent-blue-500" oninput="updateGlass()">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Transparency: <span id="transVal">0.25</span></label>
                    <input type="range" id="transRange" min="0.05" max="1" step="0.05" value="0.25" class="w-full accent-blue-500" oninput="updateGlass()">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Border Width: <span id="borderVal">1</span>px</label>
                    <input type="range" id="borderRange" min="0" max="5" value="1" class="w-full accent-blue-500" oninput="updateGlass()">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Generated CSS:</label>
                    <textarea id="cssOutput" rows="3" readonly class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded font-mono text-xs text-blue-300 focus:outline-none"></textarea>
                    <button onclick="copyCSS()" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-xs font-medium transition">Copy CSS</button>
                </div>
            </div>

            <!-- Preview Box -->
            <div class="h-64 rounded-xl relative flex items-center justify-center overflow-hidden bg-gradient-to-tr from-purple-600 via-pink-500 to-blue-500 shadow-inner">
                <div class="absolute w-24 h-24 bg-yellow-400 rounded-full blur-xl opacity-60 -top-5 -left-5"></div>
                <div class="absolute w-24 h-24 bg-cyan-400 rounded-full blur-xl opacity-60 -bottom-5 -right-5"></div>
                <div id="glassCard" class="w-48 h-36 rounded-xl flex items-center justify-center p-4 text-center font-bold text-white shadow-md transition-all text-sm">
                    Preview Card
                </div>
            </div>
        </div>
    </main>

    <script>
        function updateGlass() {
            const blur = document.getElementById('blurRange').value;
            const trans = document.getElementById('transRange').value;
            const border = document.getElementById('borderRange').value;
            document.getElementById('blurVal').innerText = blur;
            document.getElementById('transVal').innerText = trans;
            document.getElementById('borderVal').innerText = border;

            const card = document.getElementById('glassCard');
            card.style.background = `rgba(255, 255, 255, ${trans})`;
            card.style.backdropFilter = `blur(${blur}px)`;
            card.style.webkitBackdropFilter = `blur(${blur}px)`;
            card.style.border = `${border}px solid rgba(255, 255, 255, 0.3)`;

            const cssCode = `background: rgba(255, 255, 255, ${trans});\nbackdrop-filter: blur(${blur}px);\nborder: ${border}px solid rgba(255, 255, 255, 0.3);`;
            document.getElementById('cssOutput').value = cssCode;
        }
        updateGlass();
        function copyCSS() {
            navigator.clipboard.writeText(document.getElementById('cssOutput').value);
            alert('CSS copied to clipboard!');
        }
    </script>
</body>
</html>
