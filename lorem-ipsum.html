<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator - ToolNest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        textarea { width: 100%; height: 180px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; resize: vertical; box-sizing: border-box; outline: none; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1><a href="index.html" style="color:white; text-decoration:none;">ToolNest</a></h1>
            <p>Lorem Ipsum Generator</p>
        </div>
    </header>
    <main class="container" style="background: white; padding: 2rem; border-radius: 12px; margin-bottom: 3rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <h2>Lorem Ipsum Generator</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Generate placeholder dummy text for your designs and layouts.</p>
        <button class="btn" onclick="generateLorem()" style="margin-bottom: 15px;">Generate Paragraphs</button>
        <textarea id="outputText" readonly placeholder="Generated text will appear here..."></textarea>
        <button class="btn" style="background: #475569;" onclick="copyOutput()">Copy Text</button>
    </main>
    <footer class="main-footer">
        <p>&copy; 2026 ToolNest. Built for creators and developers.</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            <a href="index.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Home</a> | 
            <a href="privacy-policy.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Privacy Policy</a> | 
            <a href="about.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">About Us</a> | 
            <a href="terms.html" style="color: #60a5fa; text-decoration: none; margin: 0 5px;">Terms of Service</a>
        </p>
    </footer>
    <script>
        function generateLorem() {
            const text = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.";
            document.getElementById('outputText').value = text + "\n\n" + text;
        }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('outputText').value); alert('Copied!'); }
    </script>
</body>
</html>
